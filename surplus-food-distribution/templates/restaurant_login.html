<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Login | Sunset Servings</title>
    <style>
        /* Reusing your global Glassmorphism styles */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #000; color: #fff; overflow: hidden; }
        
        .bg-video { position: fixed; top: 50%; left: 50%; min-width: 100%; min-height: 100%; transform: translate(-50%, -50%); z-index: -2; object-fit: cover; }
        .global-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); z-index: -1; }

        .container { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        h1 { color: #e67e22; margin-bottom: 10px; font-size: 2rem; }
        p { margin-bottom: 25px; opacity: 0.8; }

        .login-form { display: flex; flex-direction: column; gap: 15px; }

        input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            outline: none;
        }

        input:focus { border-color: #e67e22; }

        .glass-btn {
            background: #e67e22;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .glass-btn:hover { background: #f39c12; transform: translateY(-2px); }
        
        .alert { color: #ff4757; font-size: 0.9rem; margin-bottom: 15px; }
        .register-link { display: block; margin-top: 20px; color: #fff; text-decoration: none; opacity: 0.6; font-size: 0.9rem; }
        .register-link:hover { opacity: 1; }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline class="bg-video">
        <source src="{{ url_for('static', filename='video/food.mp4') }}" type="video/mp4">
    </video>
    <div class="global-overlay"></div>

    <div class="container">
        <div class="glass-card">
            <h1>Restaurant Login</h1>
            <p>Access your partner dashboard</p>

            {% with messages = get_flashed_messages() %}
              {% if messages %}
                {% for message in messages %}
                  <div class="alert">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('restaurant_login') }}" class="login-form">
                <input type="email" name="email" placeholder="Business Email" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit" class="glass-btn">Login</button>
            </form>

            <a href="/restaurant/register" class="register-link">
                Don't have an account? Register here
            </a>
        </div>
    </div>

</body>
</html>
