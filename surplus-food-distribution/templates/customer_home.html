<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Food | Sunset Servings</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #000; color: #fff; line-height: 1.6; overflow-x: hidden; padding-bottom: 100px; }

        /* Video Background Styling */
        .bg-video { position: fixed; top: 50%; left: 50%; min-width: 100%; min-height: 100%; transform: translate(-50%, -50%); z-index: -2; object-fit: cover; }
        .global-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: -1; }

        .container { padding: 40px 20px; max-width: 1200px; margin: auto; }
        .glass-panel { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 20px; padding: 30px; margin-bottom: 30px; }

        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .top-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        
        input { padding: 12px; border-radius: 10px; border: none; background: rgba(255, 255, 255, 0.2); color: white; margin-top: 5px; outline: none; width: 100%; }
        input:focus { border: 1px solid #e67e22; }

        /* Map Container */
        #map { height: 100%; width: 100%; min-height: 350px; border-radius: 15px; z-index: 1; border: 1px solid rgba(255,255,255,0.1); }

        /* Food Grid Styling */
        .food-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .food-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 15px; padding: 20px; transition: 0.3s; }
        .food-card:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 0.15); }
        .price-tag { color: #e67e22; font-size: 1.5rem; font-weight: bold; margin: 10px 0; }
        
        /* Buttons */
        .btn { padding: 12px 25px; border-radius: 50px; font-weight: 600; cursor: pointer; transition: 0.3s; text-decoration: none; border: none; color: white; display: inline-block; text-align: center; }
        .btn-primary { background: #e67e22; width: 100%; margin-top: 10px; }
        .btn-logout { border: 1px solid #e74c3c; color: #e74c3c; background: transparent; }
        .btn-logout:hover { background: #e74c3c; color: #fff; }
        .btn-order { background: transparent; border: 2px solid #e67e22; width: 100%; margin-top: 10px; }
        .btn-order:hover { background: #e67e22; }

        /* Floating Cart Footer */
        .cart-footer { position: fixed; bottom: 30px; right: 30px; z-index: 1000; }
        .btn-cart { background: #e67e22; padding: 15px 30px; display: flex; gap: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); border-radius: 50px; }

        @media (max-width: 768px) { .top-section { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline class="bg-video">
        <source src="{{ url_for('static', filename='video/food.mp4') }}" type="video/mp4">
    </video>
    <div class="global-overlay"></div>

    {% if session.get('cart') %}
    <div class="cart-footer">
        <a href="{{ url_for('checkout') }}" class="btn btn-cart">🛒 View Cart <span>{{ session['cart']|length }}</span></a>
    </div>
    {% endif %}

    <div class="container">
        <header class="dashboard-header">
            <h1>Sunset Servings</h1>
            <a href="{{ url_for('logout') }}" class="btn btn-logout">Logout</a>
        </header>

        <div class="top-section">
            <div class="glass-panel">
                <h3>Find Food</h3>
                <form method="GET">
                    <input type="text" name="food" placeholder="What are you craving?" value="{{ request.args.get('food', '') }}">
                    <input type="text" name="location" placeholder="Near which area?" value="{{ request.args.get('location', '') }}">
                    <button type="submit" class="btn btn-primary">Search Now</button>
                </form>
            </div>

            <div class="glass-panel" style="padding: 10px;">
                <div id="map"></div>
            </div>
        </div>

        <h2>Surplus Food Near You</h2>
        <div class="food-grid">
            {% for food in foods %}
            <div class="food-card">
                <h3>{{ food.name }}</h3>
                <p>📍 {{ food.location }}</p>
                <p class="price-tag">₹{{ food.discounted_price }}</p>
                <form action="{{ url_for('add_to_cart', food_id=food.id) }}" method="POST">
                    <input type="number" name="order_quantity" value="1" min="1" max="{{ food.quantity }}" 
                           style="width: 70px; margin-bottom: 10px; padding: 5px; border-radius: 5px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2);">
                    <button type="submit" class="btn btn-order">Add to Cart</button>
                </form>
            </div>
            {% endfor %}
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Initialize map centered on Kerala
        const map = L.map('map').setView([10.8505, 76.2711], 7);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 2. Load coordinates directly from the database
        const locations = {{ locations_json | tojson }};
        
        function addPins() {
            const markerCoords = [];

            locations.forEach(loc => {
                // Only create pins if Lat/Lon coordinates exist in DB
                if (loc.lat && loc.lon) {
                    const lat = parseFloat(loc.lat);
                    const lon = parseFloat(loc.lon);

                    // Create marker and detailed popup instantly
                    const marker = L.marker([lat, lon]).addTo(map);
                    marker.bindPopup(`
                        <div style="color: #000; font-family: sans-serif;">
                            <strong style="color: #e67e22; font-size: 1rem;">${loc.restaurant_name}</strong><br>
                            <span style="display:block; margin: 5px 0;">🍴 ${loc.food_name}</span>
                            <b style="font-size: 1.1rem;">₹${loc.price}</b><br>
                            <a href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}" 
                               target="_blank" 
                               style="color: #3498db; text-decoration: none; font-size: 0.8rem; font-weight: bold; display: block; margin-top: 8px;">
                               Get Directions →
                            </a>
                        </div>
                    `);
                    
                    markerCoords.push([lat, lon]);
                }
            });

            // 3. Automatically adjust map zoom to fit all visible markers
            if (markerCoords.length > 0) {
                const bounds = L.latLngBounds(markerCoords);
                map.fitBounds(bounds, { padding: [50, 50] });
            }
        }

        // Execute pin placement immediately
        addPins();
    </script>
</body>
</html>
