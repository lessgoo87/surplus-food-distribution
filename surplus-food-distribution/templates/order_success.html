<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | Sunset Servings</title>
    <style>
        /* Reusing your global styles */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #000; color: #fff; overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; }

        .bg-video { position: fixed; top: 50%; left: 50%; min-width: 100%; min-height: 100%; transform: translate(-50%, -50%); z-index: -2; object-fit: cover; }
        .global-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); z-index: -1; }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 40px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .icon-success { font-size: 4rem; color: #e67e22; margin-bottom: 20px; display: block; }
        h1 { font-size: 2rem; margin-bottom: 10px; color: #fff; }
        p { opacity: 0.8; margin-bottom: 30px; }

        .order-details {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: left;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 5px;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #e67e22;
        }

        .btn-home {
            display: inline-block;
            padding: 15px 35px;
            background: #e67e22;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-home:hover { background: #f39c12; transform: translateY(-3px); }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline class="bg-video">
        <source src="{{ url_for('static', filename='video/food.mp4') }}" type="video/mp4">
    </video>
    <div class="global-overlay"></div>

    <div class="glass-card">
        <span class="icon-success">✔</span>
        <h1>Order Reserved!</h1>
        <p>Your meal is waiting for you. Please present this screen at the counter for pickup.</p>

        <div class="order-details">
            <h3 style="margin-bottom: 15px; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px;">Order Summary</h3>
            
            <div class="detail-row">
                <span>Status</span>
                <span style="color: #2ecc71;">Confirmed</span>
            </div>
            
            <div class="detail-row">
                <span>Payment Method</span>
                <span>Pay at Counter</span>
            </div>

            <div class="total-row">
                <span>Total to Pay:</span>
                <span>₹{{ request.args.get('amount', '0.00') }}</span>
            </div>
        </div>

        <a href="{{ url_for('customer_home') }}" class="btn-home">Back to Home</a>
    </div>

</body>
</html>
