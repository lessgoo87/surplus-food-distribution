<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Register | Sunset Servings</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* UI System Style Consistency */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: #000; color: #fff; overflow-x: hidden; }
        
        /* Background Logic */
        .bg-video { position: fixed; top: 50%; left: 50%; min-width: 100%; min-height: 100%; transform: translate(-50%, -50%); z-index: -2; object-fit: cover; }
        .global-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: -1; }

        .container { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 40px 20px; }
        
        .glass-card {
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(230, 126, 34, 0.2);
            padding: 40px;
            max-width: 650px;
            width: 100%;
            text-align: center;
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
        }

        /* FLASH POPUP STYLING */
        #flash-pop {
            background: rgba(255, 71, 87, 0.15);
            border: 1px solid #ff4757;
            color: #ff4757;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: 800;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(180deg, #fff, #e67e22);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            margin-bottom: 5px;
        }

        p.subtitle { color: rgba(255,255,255,0.6); font-size: 0.95rem; margin-bottom: 25px; }

        .register-form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full-width { grid-column: 1 / -1; }

        input { 
            width: 100%; 
            padding: 14px 18px; 
            border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            background: rgba(255, 255, 255, 0.05); 
            color: white; 
            outline: none; 
            transition: 0.3s; 
            font-size: 0.95rem;
        }
        input:focus { border-color: #e67e22; background: rgba(230, 126, 34, 0.05); box-shadow: 0 0 15px rgba(230, 126, 34, 0.2); }

        #reg-map { 
            height: 250px; 
            width: 100%; 
            border-radius: 15px; 
            margin: 10px 0; 
            border: 1px solid rgba(255,255,255,0.1); 
            z-index: 10; 
            background: #111; 
        }

        .map-label {
            display: block;
            text-align: left;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #e67e22;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .glass-btn { 
            grid-column: 1 / -1; 
            background: #e67e22; 
            color: white; 
            border: none; 
            padding: 16px; 
            border-radius: 50px; 
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            cursor: pointer; 
            transition: 0.4s; 
            margin-top: 10px; 
        }
        .glass-btn:hover { background: #fff; color: #e67e22; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(230, 126, 34, 0.3); }
        
        .switch-link { grid-column: 1 / -1; display: block; margin-top: 20px; color: rgba(255,255,255,0.6); text-decoration: none; font-size: 0.85rem; }
        .switch-link strong { color: #e67e22; }
        .switch-link:hover { color: #fff; }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline class="bg-video">
        <source src="{{ url_for('static', filename='video/food.mp4') }}" type="video/mp4">
    </video>
    <div class="global-overlay"></div>

    <div class="container">
        <div class="glass-card">
            
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div id="flash-pop">
                    {% for message in messages %}
                      ⚠️ {{ message }}
                    {% endfor %}
                </div>
                <script>
                    setTimeout(() => {
                        const pop = document.getElementById('flash-pop');
                        if(pop) {
                            pop.style.transition = "opacity 0.5s ease";
                            pop.style.opacity = '0';
                            setTimeout(() => { pop.style.display = 'none'; }, 500);
                        }
                    }, 4000);
                </script>
              {% endif %}
            {% endwith %}

            <h1>Partner With Us</h1>
            <p class="subtitle">Join the mission and start saving food today</p>

            <form method="POST" action="{{ url_for('restaurant_register') }}" class="register-form">
                <input type="text" name="name" placeholder="Restaurant Name" class="full-width" required>
                <input type="text" name="address" placeholder="Complete Street Address" class="full-width" required>
                
                <input type="text" name="category" placeholder="Cuisine (e.g. Italian, Bakery)" required>
                <input type="text" name="phone" placeholder="Contact Number" required>

                <input type="email" name="email" placeholder="Business Email" required>
                <input type="password" name="password" placeholder="Create Password" required>

                <input type="hidden" name="lat" id="lat_input" required>
                <input type="hidden" name="lon" id="lon_input" required>

                <div class="full-width">
                    <label class="map-label">📍 Pin Your Exact Location</label>
                    <div id="reg-map"></div>
                </div>

                <button type="submit" class="glass-btn">Create Partner Account</button>
            </form>

            <a href="{{ url_for('restaurant_login') }}" class="switch-link">Already a partner? <strong>Login here</strong></a>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize Map
        const regMap = L.map('reg-map').setView([10.8505, 76.2711], 10);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(regMap);

        // Map Rendering Fix
        setTimeout(function() {
            regMap.invalidateSize();
        }, 500);

        let marker;
        regMap.on('click', function(e) {
            if (marker) regMap.removeLayer(marker);
            marker = L.marker(e.latlng).addTo(regMap);
            document.getElementById('lat_input').value = e.latlng.lat;
            document.getElementById('lon_input').value = e.latlng.lng;
        });

        // Locate user
        regMap.locate({setView: true, maxZoom: 16});
        regMap.on('locationfound', function(e) {
            if (marker) regMap.removeLayer(marker);
            marker = L.marker(e.latlng).addTo(regMap);
            document.getElementById('lat_input').value = e.latlng.lat;
            document.getElementById('lon_input').value = e.latlng.lng;
        });
    </script>
</body>
</html>
