<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Register | Sunset Servings</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #000; color: #fff; overflow: hidden; }
        
        /* Background Logic */
        .bg-video { position: fixed; top: 50%; left: 50%; min-width: 100%; min-height: 100%; transform: translate(-50%, -50%); z-index: -2; object-fit: cover; }
        .global-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); z-index: -1; }

        .container { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            max-width: 550px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        /* Flash Alert Styling */
        .alert-container {
            margin-bottom: 20px;
        }
        .alert {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid #e74c3c;
            color: #ff4757;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        h1 { color: #e67e22; margin-bottom: 5px; font-size: 2rem; }
        p.subtitle { margin-bottom: 25px; opacity: 0.8; font-weight: 300; }

        .register-form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full-width { grid-column: 1 / -1; }

        input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: #e67e22; background: rgba(0, 0, 0, 0.5); }

        .glass-btn {
            grid-column: 1 / -1;
            background: #e67e22;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 50px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .glass-btn:hover { background: #f39c12; transform: translateY(-2px); }
        .switch-link { display: block; margin-top: 20px; color: #fff; text-decoration: none; opacity: 0.6; font-size: 0.9rem; }
        .switch-link:hover { opacity: 1; }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline class="bg-video">
        <source src="{{ url_for('static', filename='video/food.mp4') }}" type="video/mp4">
    </video>
    <div class="global-overlay"></div>

    <div class="container">
        <div class="glass-card">
            
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="alert-container">
                  {% for message in messages %}
                    <div class="alert">{{ message }}</div>
                  {% endfor %}
                </div>
              {% endif %}
            {% endwith %}

            <h1>Partner With Us</h1>
            <p class="subtitle">Register your restaurant to start saving food</p>

            <form method="POST" action="{{ url_for('restaurant_register') }}" class="register-form">
                <input type="text" name="name" placeholder="Restaurant Name" class="full-width" required>
                <input type="text" name="address" placeholder="Complete Street Address" class="full-width" required>
                
                <input type="text" name="category" placeholder="Category (e.g. Italian)" required>
                <input type="text" name="phone" placeholder="Contact Number" required>

                <input type="email" name="email" placeholder="Business Email" required>
                <input type="password" name="password" placeholder="Password" required>

                <button type="submit" class="glass-btn">Create Account</button>
            </form>

            <a href="{{ url_for('restaurant_login') }}" class="switch-link">Already partner? Login here</a>
        </div>
    </div>

</body>
</html>
