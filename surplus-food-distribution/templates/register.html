<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Register | Sunset Servings</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* UI System Style Consistency */
        body.restaurant-bg {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        .glass-card {
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(230, 126, 34, 0.2);
            padding: 50px 40px;
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(180deg, #fff, #e67e22);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            margin-bottom: 10px;
        }

        p { color: rgba(255,255,255,0.6); font-size: 0.95rem; margin-bottom: 30px; }

        /* FLASH POPUP STYLING */
        #flash-pop {
            background: rgba(255, 71, 87, 0.15);
            border: 1px solid #ff4757;
            color: #ff4757;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: 800;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        input:focus {
            border-color: #e67e22;
            box-shadow: 0 0 15px rgba(230, 126, 34, 0.2);
            background: rgba(230, 126, 34, 0.05);
        }

        .glass-btn {
            width: 100%;
            background: #e67e22;
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.4s;
            letter-spacing: 1px;
        }

        .glass-btn:hover { 
            background: #fff; 
            color: #e67e22; 
            transform: translateY(-3px); 
        }

        .login-link { margin-top: 25px; color: rgba(255,255,255,0.8); }
        .login-link a { color: #e67e22; text-decoration: none; font-weight: 800; }
        .back-link { margin-top: 20px; color: rgba(255,255,255,0.4); text-decoration: none; font-size: 0.85rem; display: inline-block; }
    </style>
</head>

<body class="restaurant-bg">

<div class="glass-card">
    <h1>Create Account</h1>
    <p>Join the mission at Sunset Servings</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div id="flash-pop">
            {% for message in messages %}
              ⚠️ {{ message }}
            {% endfor %}
        </div>
        <script>
            setTimeout(() => {
                const pop = document.getElementById('flash-pop');
                if(pop) {
                    pop.style.transition = "opacity 0.5s ease";
                    pop.style.opacity = '0';
                    setTimeout(() => { pop.style.display = 'none'; }, 500);
                }
            }, 4000);
        </script>
      {% endif %}
    {% endwith %}

    <form method="POST">
        <input type="text" name="name" placeholder="Full Name" required autocomplete="name">
        
        <input type="email" name="email" placeholder="Email Address" required autocomplete="email">
        
        <input type="text" name="city" placeholder="Your City (e.g. Thrissur, Kerala)" required>
        
        <input type="password" name="password" placeholder="Create Password" required autocomplete="new-password">

        <button type="submit" class="glass-btn">Register</button>
    </form>

    <div class="login-link">
        Already have an account? <a href="{{ url_for('login') }}">Login</a>
    </div>
    
    <a href="/" class="back-link">← Back to Home</a>
</div>

</body>
</html>
