<!DOCTYPE html>
<html>
<head>
    <title>Customer Register | Sunset Servings</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="restaurant-bg">

<div class="glass-card">
    <h1>Create Account</h1>
    <p>Join Sunset Servings</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div style="background: rgba(231, 76, 60, 0.2); border: 1px solid #e74c3c; color: #fff; padding: 10px; border-radius: 10px; margin-bottom: 20px; font-size: 0.9rem;">
              {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
        <input type="text" name="name" placeholder="Your Name" required><br><br>
        <input type="email" name="email" placeholder="Email" required><br><br>
        <input type="password" name="password" placeholder="Password" required><br><br>

        <button type="submit" class="glass-btn">Register</button>
    </form>

    <br>
    <p>
        Already have an account?
        <a href="{{ url_for('login') }}" style="color:white; font-weight:bold;">Login</a>
    </p>
</div>

</body>
</html>
