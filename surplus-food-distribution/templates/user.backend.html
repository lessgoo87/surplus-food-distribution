<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Food</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="map-layout">
    
    <!-- LEFT: Search Sidebar -->
    <div class="search-panel">
        <h3>Search Filters</h3>

        <form method="GET">
            <label>Food Name</label>
            <input type="text" name="food" placeholder="e.g. Cake">

            <label>Location</label>
            <input type="text" name="location" placeholder="e.g. Edappally">

            <button type="submit">Search</button>
        </form>
    </div>

    <!-- RIGHT: Map -->
    <div class="map-panel">
        <h3>Nearby Surplus Food (Map View)</h3>

        <iframe
            width="100%"
            height="350"
            class="map-iframe"
            loading="lazy"
            allowfullscreen
            title="Google Map showing nearby surplus food locations"
            src="https://www.google.com/maps?q={{ request.args.get('location', 'Kochi') }}&output=embed">
        </iframe>
    </div>

</div>

<hr>

<div class="container">
    <h2>Available Surplus Food</h2>

    <div class="food-grid">
        {% for food in foods %}
        <div class="food-card">
            <div class="food-card-content">
                <h3>{{ food.name }}</h3>
                <p><strong>Price:</strong> ₹{{ food.discounted_price }}</p>
                <p><strong>Location:</strong> {{ food.location }}</p>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
