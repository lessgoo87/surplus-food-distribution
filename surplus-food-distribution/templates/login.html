<!DOCTYPE html>
<html>
<head>
    <title>Customer Login | Sunset Servings</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="restaurant-bg">

<div class="glass-card">
    <h1>Customer Login</h1>
    <p>Access your account</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div style="background: rgba(46, 204, 113, 0.2); border: 1px solid #2ecc71; color: #2ecc71; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; text-align: center;">
              {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" autocomplete="off">
        <input type="email" name="email" placeholder="Email" required autocomplete="new-password"><br><br>
        <input type="password" name="password" placeholder="Password" required autocomplete="new-password"><br><br>

        <button type="submit" class="glass-btn">Login</button>
    </form>

    <br>
    <p>
        Don't have an account? 
        <a href="/register" style="color:white; font-weight:bold;">Register</a>
    </p>
    
    <p style="margin-top: 15px;">
        <a href="/" style="color:rgba(255,255,255,0.7); font-size: 0.9rem; text-decoration: none;">← Back to Home</a>
    </p>
</div>

</body>
</html>
